[env:esp32-wroom-32]
platform = espressif32@^6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = time, esp32_exception_decoder
lib_ldf_mode = chain+
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    sensirion/Sensirion I2C SCD30@^1.0.0
    adafruit/Adafruit BME680 Library@^2.0.4
    knolleary/PubSubClient@^2.8